name: Integrar mejoras Refugios en rama de revisión
on:
  push:
    branches:
      - mejora-verificacion-capacidad-20261105
    paths:
      - .github/workflows/integrar-mejoras-refugios.yml
      - complemento-operativo-20261105.js
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener rama de revisión
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Integrar complemento sin sustituir la aplicación
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file=Path('index.html')
          html=file.read_text(encoding='utf-8')
          marker='<script src="./complemento-operativo-20261105.js"></script>'
          if marker not in html:
              assert '</body>' in html, 'No se encontró cierre del documento: no se modifica la app'
              html=html.replace('</body>',marker+'\n</body>',1)
              file.write_text(html,encoding='utf-8')
          assert html.count(marker)==1
          print('Integración conservadora verificada')
          PY
      - name: Confirmar modificación en rama, no en producción
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Integrar complemento operativo en la guía sin cambiar funciones existentes"
            git push
          fi
