name: Integrar y comprobar ancho adaptable Refugios
on:
  push:
    branches:
      - ajuste-ancho-responsive-20261105
    paths:
      - ancho-responsive-v134.css
      - .github/workflows/ajustar-ancho-refugios.yml
      - service-worker.js
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrar-y-validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insertar una sola hoja CSS en la cabecera HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file=Path('index.html')
          html=file.read_text(encoding='utf-8')
          marker='<link rel="stylesheet" href="./ancho-responsive-v134.css"/>'
          assert html.count('</head>') >= 1, 'No se encontró cierre de head'
          if marker not in html:
              head=html.find('</head>')
              assert head < 200000, 'Cabecera HTML inesperadamente larga'
              html=html[:head]+marker+'\n'+html[head:]
          assert html.count(marker)==1, 'Referencia a estilos duplicada'
          assert html.index(marker) < html.index('</head>'), 'Enlace no se insertó en la cabecera'
          assert html.count('complemento-operativo-20261105.js')>=1, 'Falta el complemento operativo anterior'
          file.write_text(html,encoding='utf-8')
          print('Estilo insertado sin tocar JS ni formularios')
          PY
      - name: Comprobar integridad visual y compatibilidad
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          css=Path('ancho-responsive-v134.css').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          assert css.count('{')==css.count('}'), 'Bloques CSS desbalanceados'
          assert '@media screen and (min-width: 1280px)' in css
          assert '@media screen and (min-width: 900px) and (max-width: 1279.98px)' in css
          assert 'min-width: 900px' in css and 'max-width: 1279.98px' in css
          for module in ('preparacion','verificacion','acciones','rapida','activacion','operacion'):
              assert 'id="'+module+'"' in html, 'Falta sección: '+module
          assert html.count('<link rel="stylesheet" href="./ancho-responsive-v134.css"/>')==1
          assert 'ancho-responsive-v134.css' in sw
          assert 'refugios-ipcet-v134' in sw
          print('Validación estructural correcta; reglas de tabletas pequeñas y teléfonos originales conservadas')
          PY
          node --check complemento-operativo-20261105.js
          node --check service-worker.js
      - name: Guardar el ajuste únicamente en la rama de prueba
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Vincular estilos adaptables a la guía"
            git push
          fi
